
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyVideo AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif;padding:22px}
header{text-align:center;padding:25px 0}
.logo{font-size:30px;font-weight:bold;color:#8b7cff}
header p{color:#aab1c5}
main{max-width:650px;margin:auto;background:#151c2e;padding:22px;border:1px solid #303a55;border-radius:20px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
button{cursor:pointer;border:0;border-radius:10px;padding:13px;font-weight:bold}
.tabs button{flex:1;background:#252e45;color:white}
.tabs button.active{background:#725cff}
label{display:block;margin:18px 0 9px;font-weight:bold}
textarea{width:100%;height:125px;background:#0d1424;color:white;border:1px solid #39445f;border-radius:12px;padding:14px;font-size:16px}
input[type=file]{width:100%;padding:14px;background:#0d1424;border-radius:10px;color:white}
.durations{display:flex;gap:10px}
.durations button{background:#252e45;color:white;flex:1}
.durations button.active{background:#725cff}
.generate{width:100%;margin-top:24px;background:linear-gradient(90deg,#725cff,#a34cff);color:white;font-size:17px}
#message{color:#b9c2d8;text-align:center;margin-top:18px;line-height:1.5}
footer{text-align:center;color:#77819a;margin:25px}
</style>
</head>
<body>
<header>
<div class="logo">✦ MyVideo AI</div>
<p>Create your video ideas with AI</p>
</header>
<main>
<div class="tabs">
<button id="textTab" class="active" onclick="setMode('text')">Text to Video</button>
<button id="imageTab" onclick="setMode('image')">Image to Video</button>
</div>
<label>Your Video Prompt</label>
<textarea id="prompt" placeholder="Describe the video you want to create..."></textarea>
<div id="uploadArea" style="display:none">
<label>Upload Your Image</label>
<input type="file" id="image" accept="image/*">
</div>
<label>Video Duration</label>
<div class="durations">
<button class="active" onclick="setDuration(5,this)">5 Seconds</button>
<button onclick="setDuration(10,this)">10 Seconds</button>
</div>
<button class="generate" onclick="generate()">✦ Generate Video</button>
<div id="message">Your creative studio is ready!</div>
</main>
<footer>MyVideo AI · Free Demo Studio</footer>
<script>
let mode='text',duration=5;
function setMode(m){
 mode=m;
 textTab.classList.toggle('active',m==='text');
 imageTab.classList.toggle('active',m==='image');
 uploadArea.style.display=m==='image'?'block':'none';
}
function setDuration(n,btn){
 duration=n;
 document.querySelectorAll('.durations button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}
function generate(){
 let p=document.getElementById('prompt').value.trim();
 if(!p){message.textContent='Please write your video prompt first.';return;}
 if(mode==='image'&&!image.files.length){message.textContent='Please upload an image first.';return;}
 message.textContent='Your prompt is ready! AI video generation API is not connected yet.';
}
</script>
</body>
</html>
